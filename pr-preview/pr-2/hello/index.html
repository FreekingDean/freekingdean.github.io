<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello · The Playground</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    .stage { flex: 1; display: grid; place-items: center; text-align: center; padding: 16px; }
    #greeting { font-size: clamp(2rem, 10vw, 5rem); font-weight: 700; margin: 0 0 24px; min-height: 1.2em; }
    button {
      font: inherit; font-size: 1.1rem; padding: 12px 24px; border-radius: 999px;
      border: 0; background: var(--accent); color: #fff; cursor: pointer;
    }
    button:active { transform: scale(0.96); }
  </style>
</head>
<body>
  <div class="stage">
    <div>
      <p id="greeting">👋</p>
      <button id="go">Say hello</button>
      <p><a href="../">← back to the playground</a></p>
    </div>
  </div>
  <script>
    const hellos = ["Hello!", "Hola!", "Bonjour!", "Ciao!", "Hallo!", "Olá!", "Konnichiwa!", "Namaste!", "Hej!", "Ahoy!"];
    let last = -1;
    document.getElementById("go").addEventListener("click", () => {
      let i;
      do { i = Math.floor(Math.random() * hellos.length); } while (i === last);
      last = i;
      document.getElementById("greeting").textContent = hellos[i];
    });
  </script>
</body>
</html>
